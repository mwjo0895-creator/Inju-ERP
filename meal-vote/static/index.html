<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식수 투표</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>식수 투표</h1>
  <nav>
    <span id="who"></span>
    <button id="logout" class="link" hidden>로그아웃</button>
    <a href="/board">현황판</a>
  </nav>
</header>

<main>
  <section id="auth" class="card" hidden>
    <div class="tabs">
      <button type="button" data-tab="login" class="on">로그인</button>
      <button type="button" data-tab="register">처음 사용 (등록)</button>
    </div>
    <form id="login-form">
      <label>사번 <input name="empNo" required autocomplete="username"></label>
      <label>PIN <input name="pin" type="password" inputmode="numeric" required autocomplete="current-password"></label>
      <button class="primary">로그인</button>
    </form>
    <form id="register-form" hidden>
      <label>사번 <input name="empNo" required maxlength="20" autocomplete="username"></label>
      <label>이름 <input name="name" required maxlength="20"></label>
      <label id="dept-label">부서</label>
      <label>PIN (숫자 4~8자리, 로그인할 때 사용) <input name="pin" type="password" inputmode="numeric" required pattern="\d{4,8}" autocomplete="new-password"></label>
      <label>PIN 확인 <input name="pin2" type="password" inputmode="numeric" required autocomplete="new-password"></label>
      <button class="primary">등록하고 시작</button>
    </form>
    <p class="msg" id="auth-msg"></p>
  </section>

  <section id="vote" hidden>
    <div class="toolbar">
      <span class="clock" id="clock"></span>
      <button id="all-eat" type="button">미응답 모두 '먹음'</button>
    </div>
    <div id="days"></div>
    <p class="hint">마감 시각은 서버 시계 기준이며, 마감이 지나면 자동으로 잠겨 누구도 바꿀 수 없습니다.</p>
  </section>
</main>

<div id="toast"></div>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

let clockOffset = 0;  // 서버 시각 - 브라우저 시각 (ms)
let days = [];
const serverNow = () => Date.now() + clockOffset;

async function api(path, body) {
  const opts = { method: body === undefined ? "GET" : "POST", credentials: "same-origin" };
  if (body !== undefined) {
    opts.headers = { "Content-Type": "application/json" };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || "요청에 실패했습니다.");
    err.status = res.status;
    throw err;
  }
  return data;
}

let toastTimer;
function toast(text) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
}

function remaining(ms) {
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d > 0) return `${d}일 ${h}시간`;
  if (h > 0) return `${h}시간 ${m}분`;
  return `${m}분 ${s % 60}초`;
}

/* ---- 로그인 / 등록 ---- */

async function showAuth() {
  $("#auth").hidden = false;
  $("#vote").hidden = true;
  $("#logout").hidden = true;
  $("#who").textContent = "";
  selectTab("login");
  const cfg = await api("/api/config");
  const deptLabel = $("#dept-label");
  deptLabel.innerHTML = "부서 ";
  let input;
  if (cfg.departments.length) {
    input = document.createElement("select");
    input.innerHTML = '<option value="">선택하세요</option>' +
      cfg.departments.map((d) => `<option>${esc(d)}</option>`).join("");
  } else {
    input = document.createElement("input");
    input.maxLength = 30;
  }
  input.name = "dept";
  input.required = true;
  deptLabel.append(input);
}

function selectTab(tab) {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  $("#login-form").hidden = tab !== "login";
  $("#register-form").hidden = tab !== "register";
  $("#auth-msg").textContent = "";
}
document.querySelectorAll(".tabs button").forEach((btn) => btn.addEventListener("click", () => selectTab(btn.dataset.tab)));

$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    await api("/api/login", { empNo: f.empNo.value, pin: f.pin.value });
    f.reset();
    start();
  } catch (err) {
    $("#auth-msg").textContent = err.message;
  }
});

$("#register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.pin.value !== f.pin2.value) {
    $("#auth-msg").textContent = "PIN 확인이 일치하지 않습니다.";
    return;
  }
  try {
    await api("/api/register", { empNo: f.empNo.value, name: f.name.value, dept: f.dept.value, pin: f.pin.value });
    f.reset();
    start();
  } catch (err) {
    $("#auth-msg").textContent = err.message;
  }
});

$("#logout").addEventListener("click", async () => {
  await api("/api/logout", {});
  showAuth();
});

/* ---- 투표 ---- */

async function loadSlots() {
  const data = await api("/api/slots");
  clockOffset = data.serverTime - Date.now();
  days = data.days;
  render();
}

function render() {
  $("#days").innerHTML = days.map((day) => `
    <div class="card day">
      <h2>${esc(day.label)}${day.isToday ? '<span class="today">오늘</span>' : ""}</h2>
      ${day.meals.length ? day.meals.map((m) => mealRow(day, m)).join("") : '<p class="none">식사 없음 (휴무)</p>'}
    </div>`).join("");
  tick();
}

function mealRow(day, m) {
  const key = `${day.date}|${m.id}`;
  if (m.status === "closed") {
    const result = m.choice === "eat" ? '<b class="eat">먹음</b>' : m.choice === "skip" ? '<b class="skip">안먹음</b>' : "미응답";
    return `<div class="meal">
      <div class="info"><div class="name">${esc(m.name)}</div><div class="due">${esc(m.cutoffLabel)}됨</div></div>
      <div class="locked">마감 · ${result}</div>
    </div>`;
  }
  return `<div class="meal">
    <div class="info"><div class="name">${esc(m.name)}</div><div class="due" data-due="${m.cutoffAt}">${esc(m.cutoffLabel)}</div></div>
    <div class="choices">
      <button type="button" class="eat ${m.choice === "eat" ? "on" : ""}" data-key="${key}" data-choice="eat">먹음</button>
      <button type="button" class="skip ${m.choice === "skip" ? "on" : ""}" data-key="${key}" data-choice="skip">안먹음</button>
    </div>
  </div>`;
}

function findMeal(key) {
  const [date, id] = key.split("|");
  const day = days.find((d) => d.date === date);
  return { date, meal: day && day.meals.find((m) => m.id === id) };
}

async function vote(date, meal, choice) {
  try {
    await api("/api/vote", { date, meal: meal.id, choice });
    meal.choice = choice;
    return true;
  } catch (err) {
    toast(err.message);
    if (err.status === 401) showAuth();
    else loadSlots();
    return false;
  }
}

$("#days").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-choice]");
  if (!btn) return;
  const { date, meal } = findMeal(btn.dataset.key);
  if (!meal || meal.choice === btn.dataset.choice) return;
  if (await vote(date, meal, btn.dataset.choice)) render();
});

$("#all-eat").addEventListener("click", async () => {
  let count = 0;
  for (const day of days) {
    for (const meal of day.meals) {
      if (meal.status === "open" && !meal.choice) {
        if (!(await vote(day.date, meal, "eat"))) return;
        count++;
      }
    }
  }
  render();
  toast(count ? `${count}건을 '먹음'으로 투표했습니다.` : "미응답 항목이 없습니다.");
});

// 1초마다 남은 시간을 갱신하고, 마감을 넘긴 항목이 생기면 서버에서 다시 받아 잠근다.
function tick() {
  const now = serverNow();
  $("#clock").textContent = "서버 시각 " + new Date(now).toLocaleString("ko-KR", {
    timeZone: "Asia/Seoul", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
  let expired = false;
  document.querySelectorAll("[data-due]").forEach((el) => {
    const left = Number(el.dataset.due) - now;
    if (left <= 0) {
      expired = true;
      return;
    }
    el.textContent = left < 86400000 ? `마감까지 ${remaining(left)}` : el.textContent;
    el.classList.toggle("soon", left < 3600000);
  });
  if (expired) loadSlots();
}
setInterval(() => { if (!$("#vote").hidden) tick(); }, 1000);

async function start() {
  try {
    const me = await api("/api/me");
    $("#who").textContent = `${me.dept} ${me.name}`;
    $("#logout").hidden = false;
    $("#auth").hidden = true;
    $("#vote").hidden = false;
    await loadSlots();
  } catch (err) {
    if (err.status === 401) showAuth();
    else toast(err.message);
  }
}
start();
</script>
</body>
</html>
