<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식수 투표</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>식수 투표</h1>
  <nav>
    <span id="who"></span>
    <button id="logout" class="link" hidden>로그아웃</button>
    <a href="/board">현황판</a>
  </nav>
</header>

<main>
  <section id="nologin" class="card" hidden>
    <h2>Teams 메시지의 버튼으로 들어와 주세요</h2>
    <p>투표 시간이 되면 Teams로 <b>먹음 / 안먹음</b> 버튼이 담긴 메시지가 옵니다.
      버튼을 누르면 로그인 없이 바로 투표되고, 이 브라우저가 기억해서 다음부터는 이 주소로 바로 들어올 수 있습니다.</p>
    <p class="hint">메시지를 받지 못했다면 팀 식수 담당자에게 알려 주세요.</p>
  </section>

  <div id="banner" class="banner" hidden></div>

  <section id="vote" hidden>
    <div class="toolbar"><span class="clock" id="clock"></span></div>
    <div id="today"></div>
    <p class="hint">마감 시각은 서버 시계 기준이며, 마감이 지나면 자동으로 잠겨 누구도 바꿀 수 없습니다.
      투표하지 않으면 식사가 준비되지 않습니다.</p>
  </section>
</main>

<div id="toast"></div>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const CHOICE = { eat: "먹음", skip: "안먹음" };

let clockOffset = 0;  // 서버 시각 - 브라우저 시각 (ms)
let me = null;
let today = null;  // 오늘 식사 목록 (서버 /api/slots)
const serverNow = () => Date.now() + clockOffset;

async function api(path, body) {
  const opts = { method: body === undefined ? "GET" : "POST", credentials: "same-origin" };
  if (body !== undefined) {
    opts.headers = { "Content-Type": "application/json" };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || "요청에 실패했습니다.");
    err.status = res.status;
    throw err;
  }
  return data;
}

let toastTimer;
function toast(text) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
}

function banner(text, ok) {
  const el = $("#banner");
  el.textContent = text;
  el.className = "banner " + (ok ? "ok" : "bad");
  el.hidden = false;
}

function remaining(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h > 0 ? `${h}시간 ${m}분` : `${m}분 ${s % 60}초`;
}

function showNoLogin() {
  $("#nologin").hidden = false;
  $("#vote").hidden = true;
  $("#logout").hidden = true;
  $("#who").textContent = "";
}

$("#logout").addEventListener("click", async () => {
  await api("/api/logout", {});
  showNoLogin();
});

/* ---- 투표 ---- */

async function load() {
  today = await api("/api/slots");
  clockOffset = today.serverTime - Date.now();
  render();
}

function render() {
  $("#today").innerHTML = `<div class="card day">
    <h2>${esc(today.label)}<span class="today">오늘</span></h2>
    ${today.meals.length ? today.meals.map(mealRow).join("") : '<p class="none">오늘은 식사가 없습니다 (휴무)</p>'}
  </div>`;
  tick();
}

function mealRow(m) {
  let vote;
  if (m.status === "closed") {
    const result = m.choice ? `<b class="${m.choice}">${CHOICE[m.choice]}</b>` : "미투표";
    vote = `<div class="meal">
      <div class="info"><div class="name">${esc(m.name)}</div><div class="due">${esc(m.cutoff)} 마감됨</div></div>
      <div class="locked">마감 · ${result}</div>
    </div>`;
  } else {
    vote = `<div class="meal">
      <div class="info"><div class="name">${esc(m.name)}</div>
        <div class="due" data-due="${m.cutoffAt}" data-word="마감">${esc(m.cutoff)} 마감</div></div>
      <div class="choices">
        <button type="button" class="eat ${m.choice === "eat" ? "on" : ""}" data-meal="${m.id}" data-choice="eat">먹음</button>
        <button type="button" class="skip ${m.choice === "skip" ? "on" : ""}" data-meal="${m.id}" data-choice="skip">안먹음</button>
      </div>
    </div>`;
  }
  return vote + extraRow(m);
}

// 팀별 식수 담당자에게만 보이는 추가 인원(방문객 등) 등록 칸
function extraRow(m) {
  const x = m.extra;
  if (!x) return "";
  if (x.status === "open") {
    return `<form class="extra" data-meal="${m.id}">
      <span class="extra-label">${esc(me.grp)} 추가</span>
      <input name="count" type="number" min="0" max="200" inputmode="numeric" value="${x.count}" aria-label="추가 인원">
      <span>명</span>
      <input name="note" maxlength="200" placeholder="예: 음봉 생산팀 교육 방문" value="${esc(x.note)}" aria-label="특이사항">
      <button>저장</button>
      <span class="due" data-due="${m.finalAtMs}" data-word="확정">${esc(m.finalAt)} 확정</span>
    </form>`;
  }
  if (x.count || x.note) {
    return `<div class="extra closed">${esc(me.grp)} 추가 ${x.count}명${x.note ? " · " + esc(x.note) : ""} · 확정됨</div>`;
  }
  return "";
}

async function vote(mealId, choice) {
  await api("/api/vote", { date: today.date, meal: mealId, choice });
}

$("#today").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-choice]");
  if (!btn) return;
  const meal = today.meals.find((m) => m.id === btn.dataset.meal);
  if (meal.choice === btn.dataset.choice) return;
  try {
    await vote(meal.id, btn.dataset.choice);
    meal.choice = btn.dataset.choice;
    render();
  } catch (err) {
    toast(err.message);
    load();
  }
});

$("#today").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target.closest("form.extra");
  const count = form.count.value === "" ? 0 : Number(form.count.value);
  try {
    await api("/api/extra", { date: today.date, meal: form.dataset.meal, count, note: form.note.value });
    toast("추가 인원을 저장했습니다.");
  } catch (err) {
    toast(err.message);
  }
  load();
});

// Teams 메시지의 먹음/안먹음 버튼으로 들어온 경우: 화면이 열린 뒤 여기서 투표한다.
async function quickVote() {
  const p = new URLSearchParams(location.search);
  if (!p.has("c")) return;
  history.replaceState(null, "", "/");
  const date = p.get("d"), id = p.get("m"), choice = p.get("c");
  const meal = today.meals.find((m) => m.id === id);
  try {
    await api("/api/vote", { date, meal: id, choice });
    banner(`${today.label} ${meal ? meal.name : ""} '${CHOICE[choice] || choice}'(으)로 투표했습니다. 마감 전까지는 아래에서 바꿀 수 있습니다.`, true);
  } catch (err) {
    banner(err.message, false);
  }
  await load();
}

// 1초마다 남은 시간을 갱신하고, 마감을 넘긴 항목이 생기거나 날짜가 바뀌면 서버에서 다시 받는다.
function tick() {
  const now = serverNow();
  if (now >= today.dayEndsAt) {
    load();
    return;
  }
  $("#clock").textContent = "서버 시각 " + new Date(now).toLocaleString("ko-KR", {
    timeZone: "Asia/Seoul", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
  let expired = false;
  document.querySelectorAll("[data-due]").forEach((el) => {
    const left = Number(el.dataset.due) - now;
    if (left <= 0) {
      expired = true;
      return;
    }
    el.textContent = `${el.dataset.word}까지 ${remaining(left)}`;
    el.classList.toggle("soon", left < 3600000);
  });
  if (expired) load();
}
setInterval(() => { if (today && !$("#vote").hidden) tick(); }, 1000);

async function start() {
  try {
    me = await api("/api/me");
  } catch (err) {
    if (err.status === 401) showNoLogin();
    else toast(err.message);
    return;
  }
  $("#who").textContent = `${me.grp} · ${me.name} ${me.title}`.trim();
  $("#logout").hidden = false;
  $("#nologin").hidden = true;
  $("#vote").hidden = false;
  await load();
  await quickVote();
}
start();
</script>
</body>
</html>
