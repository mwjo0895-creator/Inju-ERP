<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식수 현황판</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>식수 현황판</h1>
  <nav><a href="/">투표하기</a></nav>
</header>

<main class="wide">
  <div class="toolbar">
    <div class="board-tools">
      <input type="date" id="date" aria-label="날짜">
      <button type="button" id="today">오늘</button>
      <a id="csv-day" href="#">이날 명단(CSV)</a>
      <a id="csv-month" href="#">이달 정산(CSV)</a>
    </div>
    <span class="clock" id="updated"></span>
  </div>
  <div id="meals" class="board-meals"></div>
  <p class="hint">30초마다 자동으로 새로고침됩니다. 투표 마감 뒤에는 팀별 담당자가 추가 인원을 등록하고, 확정 시각에 업체로 자동 통보됩니다.</p>
</main>

<script>
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function phaseBadge(m) {
  const text = {
    voting: `투표 중 · ${m.cutoff} 마감`,
    extras: `추가 인원 등록 중 · ${m.finalAt} 확정`,
    final: "최종 확정",
    upcoming: "투표 전",
  }[m.phase];
  return `<span class="badge ${m.phase}">${esc(text)}</span>`;
}

function mealCard(m) {
  const rows = m.groups.map((g) => `<tr>
      <td>${esc(g.grp)}</td><td class="num">${g.regular}</td><td class="num">${g.extra || ""}</td><td class="num"><b>${g.total}</b></td>
    </tr>`).join("");
  const notes = m.groups.filter((g) => g.note).map((g) => `<li><b>${esc(g.grp)}</b> ${esc(g.note)}</li>`).join("");
  const names = m.groups.filter((g) => g.eaters.length).map((g) =>
    `<p><b>${esc(g.grp)}</b> ${g.eaters.map(esc).join(", ")}</p>`).join("");
  return `<div class="card board-meal">
    <h2>${esc(m.name)} ${phaseBadge(m)}</h2>
    <div class="big">${m.total}<small> 명</small></div>
    <div class="sub"><span>정기 ${m.regular}</span><span>추가 ${m.extra}</span><span>안먹음 ${m.skip}</span><span>미투표 ${m.noResponse}</span></div>
    <table>
      <tr><th>분류</th><th class="num">정기</th><th class="num">추가</th><th class="num">합계</th></tr>
      ${rows}
    </table>
    ${notes ? `<ul class="notes">${notes}</ul>` : ""}
    ${names ? `<details><summary>먹는 사람 명단 (정기 ${m.regular}명)</summary>${names}</details>` : ""}
  </div>`;
}

async function load() {
  const date = $("#date").value;
  const res = await fetch("/api/summary" + (date ? `?date=${date}` : ""));
  const data = await res.json();
  if (!res.ok) {
    $("#meals").innerHTML = `<div class="card">${esc(data.error || "불러오지 못했습니다.")}</div>`;
    return;
  }
  if (!date) $("#date").value = data.date;
  $("#csv-day").href = `/api/export.csv?date=${data.date}`;
  $("#csv-month").href = `/api/export.csv?month=${data.date.slice(0, 7)}`;
  $("#updated").textContent = `${data.label} · 정기 인원 ${data.registered}명 · ` +
    new Date(data.serverTime).toLocaleTimeString("ko-KR", { timeZone: "Asia/Seoul" }) + " 기준";
  // 열어 둔 명단은 새로고침해도 열린 채로 둔다
  const open = [...document.querySelectorAll(".board-meal details")].map((d) => d.open);
  $("#meals").innerHTML = data.meals.length ? data.meals.map(mealCard).join("") : '<div class="card">이날은 식사가 없습니다.</div>';
  document.querySelectorAll(".board-meal details").forEach((d, i) => { d.open = !!open[i]; });
}

$("#date").addEventListener("change", load);
$("#today").addEventListener("click", () => { $("#date").value = ""; load(); });
load();
setInterval(load, 30000);
</script>
</body>
</html>
